# Run the app (and later its databases) locally with one command:  docker compose up --build
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # Example for later — uncomment when the project needs a database:
