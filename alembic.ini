# Alembic config. Run from the repo root:  uv run alembic upgrade head
# No database URL here on purpose: migrations/env.py reads DATABASE_URL via app Settings,
# so the password stays in .env / the environment and never lands in a committed file.

[alembic]
script_location = %(here)s/migrations
# Date prefix so `ls migrations/versions` reads in creation order (the revision id is random).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
# Format every newly generated migration with ruff, so it passes CI without hand-editing.
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = uv
ruff_fix.options = run ruff check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
