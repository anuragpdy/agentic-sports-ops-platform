[project]
name = "agentic-sports-ops-platform"
version = "0.1.0"
description = "Agentic investigation platform for a simulated sportsbook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summary lists skips with their reason. --strict-markers: a typo'd marker is an error.
addopts = "-ra --strict-markers"
# pytest-timeout: any single test running longer than this fails (named, with a traceback)
# instead of hanging until CI kills the whole job. Slowest test today: ~5 s (lock_timeout).
timeout = 60
markers = [
    "integration: needs a real Postgres (TEST_DATABASE_URL); run only these with -m integration",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "evals", "migrations"]
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.5",
]
