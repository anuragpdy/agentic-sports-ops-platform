[project]
name = "agentic-sports-ops-platform"
version = "0.1.0"
description = "Agentic investigation platform for a simulated sportsbook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "evals"]
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = ["httpx2>=2.16.2", "mypy>=2.4.1", "pytest>=9.2.0", "ruff>=0.17.5"]
